{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Insurance Claim System{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'authentication/css/style.css' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" href="{% url 'dashboard' %}">
                Insurance Claim System
            </a>

            <div class="navbar-nav ms-auto">

                {% if user.is_authenticated %}

                    <a class="nav-link"
                        href="{% url 'dashboard' %}">
                          Dashboard
                    </a>

                    <a class="nav-link"
                        href="{% url 'claim_list' %}">
                          My Claims
                    </a>

                    <a class="nav-link"
                        href="{% url 'create_claim' %}">
                          Submit Claim
                    </a>
 
                    <a class="nav-link"
                        href="{% url 'logout' %}">
                          Logout
                    </a>

                {% else %}

                    <a class="nav-link"
                       href="{% url 'login' %}">
                        Login
                    </a>

                    <a class="nav-link"
                       href="{% url 'register' %}">
                        Register
                    </a>

                {% endif %}

            </div>

        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
